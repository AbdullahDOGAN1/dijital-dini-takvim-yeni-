name: Diyanet Monthly Sync

on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

jobs:
  trigger-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger manual Diyanet sync endpoint
        env:
          DIYANET_SYNC_URL: ${{ secrets.DIYANET_SYNC_URL }}
          DIYANET_SYNC_TOKEN: ${{ secrets.DIYANET_SYNC_TOKEN }}
        run: |
          if [ -z "$DIYANET_SYNC_URL" ]; then
            echo "Missing DIYANET_SYNC_URL secret"
            exit 1
          fi

          if [ -n "$DIYANET_SYNC_TOKEN" ]; then
            HTTP_CODE=$(curl -s -o response.txt -w "%{http_code}" \
              -X GET "$DIYANET_SYNC_URL" \
              -H "Authorization: Bearer $DIYANET_SYNC_TOKEN")
          else
            HTTP_CODE=$(curl -s -o response.txt -w "%{http_code}" \
              -X GET "$DIYANET_SYNC_URL")
          fi

          echo "HTTP $HTTP_CODE"
          cat response.txt

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Sync trigger failed"
            exit 1
          fi
